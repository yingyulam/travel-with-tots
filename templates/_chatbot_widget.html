<div class="twt-chatbot">
  <button type="button" class="twt-chatbot-bubble" aria-label="Open help chat">💬</button>

  <div class="twt-chatbot-panel" hidden>
    <div class="twt-chatbot-header">
      <span>Ask about Travel with Tots</span>
      <button type="button" class="twt-chatbot-end">End chat</button>
    </div>

    <div class="twt-chatbot-model-row">
      <select>
        <option value="openrouter/free" selected>Auto (free)</option>
        <option value="nvidia/nemotron-3-super-120b-a12b:free">Nemotron 3 Super (free)</option>
        <option value="google/gemma-4-26b-a4b-it:free">Gemma 4 26B (free)</option>
        <option value="openai/gpt-4o-mini">GPT-4o mini (paid)</option>
        <option value="anthropic/claude-sonnet-5">Claude Sonnet 5 (paid)</option>
      </select>
      <a href="https://openrouter.ai/models" target="_blank" rel="noopener">More models ↗</a>
    </div>

    <div class="twt-chatbot-messages"></div>

    <div class="twt-progress" hidden>
      <span class="twt-progress-dots"><span></span><span></span><span></span></span>
      <span class="twt-progress-label">Preparing knowledge base…</span>
    </div>

    <form class="twt-chatbot-form" hidden>
      <input type="text" placeholder="Ask a question…" autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </div>
</div>
