# Render blueprint. Create the service from this file rather than by hand, so
# the start command and the environment are in the repo instead of in a form
# somebody has to remember.
services:
  - type: web
    name: travel-with-tots
    runtime: python
    plan: free
    healthCheckPath: /login

    # Just the dependencies. The search index is built at startup instead, which
    # is one API call and about a second now that embedding happens over HTTP
    # rather than by loading a 208MB model. Building it here would need
    # OPENROUTER_API_KEY during the build, and whether Render exposes dashboard
    # variables to a build is a question this no longer has to answer.
    buildCommand: pip install -r requirements.txt

    # One worker, because memory is the binding constraint. Threads rather than
    # workers because every slow path here is waiting on somebody else's API,
    # and a thread waiting on a socket costs almost nothing while a second
    # worker costs another copy of the process.
    #
    # --timeout 120 because gunicorn's default is 30 seconds and an LLM plan
    # can take longer than that; the default would kill the worker mid-request
    # and return a 502 to a parent who was simply waiting.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120

    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3

      # The disk is ephemeral, so data/data_source.json cannot survive a deploy
      # and SQLite would be empty on every boot. Pin the backend here instead.
      - key: DB_BACKEND
        value: supabase

      # Render serves this over HTTPS, so the session cookie can be marked
      # Secure and never travel in clear.
      - key: SESSION_COOKIE_SECURE
        value: "true"

      # Render sits in front of the app and sets X-Forwarded-For, so it can be
      # believed here. Off a proxy it is just a header the caller wrote, and
      # trusting it would let one attacker look like any number of addresses
      # and walk straight through the rate limits.
      - key: TRUST_PROXY
        value: "true"

      # Signs the session cookie. Generated by Render, never in the repo: a
      # known key lets anyone mint a cookie naming any parent, admin included.
      - key: SECRET_KEY
        generateValue: true

      # Set these in the Render dashboard. sync:false keeps them out of git.
      #
      # ADMIN_PASSWORD only creates an account on a database that has no admin
      # yet, so on a cloned database it does nothing: use scripts/set_admin.py
      # to change a password that already exists.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_API_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
